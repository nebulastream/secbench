data_rate: 10
period: 1000
chunk_size: 1000

pattern:
  - type: uniform
  #- fraction: 0.5
  #- distribution: 0.5

data_source:
  type: "csv"
  file: "data/smart_water/data.csv"
  #type: "image_folder"
  #file: "/app/data/img"
  #encoding: "base64"

duration: 60000
host: "0.0.0.0"
ports:
  - 9090
  - 9091
#  - 8082

mqtt:
  enabled: false
  host: "mosquitto"
  port: 1883
  topic: "bid"

  kafka:
    enabled: true
    brokers: "localhost:9092"
    topic: "bid"

zipf:
  period_ms: 1000
  s: 1.4
  stochastic: true
