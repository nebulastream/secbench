query: |
  SELECT demand_value
  FROM WATER_METER_READINGS
  INTO LEAKAGE_SINK

sinks:
  - name: LEAKAGE_SINK
    host: 10.1.1.1:8080
    parser_config: {}
    schema:
      - name: WATER_METER_READINGS$demand_value
        type: FLOAT32
    type: TCP
    config:
      output_format: CSV
      socket_host: 172.17.0.1
      socket_port: 8089
      socket_domain: AF_INET
      socket_type: SOCK_STREAM
      connect_timeout_seconds: 10

logical:
  - name: WATER_METER_READINGS
    schema:
      - name: node_type
        type: UINT8
      - name: demand_value
        type: FLOAT32
      - name: ts2
        type: UINT64
      - name: ts
        type: UINT64

physical:
  - logical: WATER_METER_READINGS
    type: TCP
    host: 10.1.1.3:8080
    parser_config:
      type: CSV
    source_config:
      socket_domain: AF_INET
      socket_type: SOCK_STREAM
      tuple_delimiter: "\n"
      flush_interval_ms: "200"
      socket_buffer_size: "1024"
      connect_timeout_seconds: "10"
      socket_host: "172.17.0.1"
      socket_port: "8082"

workers:
  - host: 10.1.1.1:8080
    data: 10.1.1.1:9090
    max_operators: 10000

  - host: 10.1.1.2:8080
    data: 10.1.1.2:9090
    max_operators: 10000
    downstream:
      - 10.1.1.1:8080

  - host: 10.1.1.3:8080
    data: 10.1.1.3:9090
    max_operators: 10000
    downstream:
      - 10.1.1.2:8080

