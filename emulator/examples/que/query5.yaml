logical:
  - name: GENERATOR_SOURCE
    schema:
      - name: DOUBLE
        type: FLOAT64

nodes:
  - connection: 172.17.0.2:9090
    grpc: 172.17.0.2:8080
    capacity: 10000
    physical:
      - logical: GENERATOR_SOURCE
        type: Generator
        parserConfig:
          type: CSV
        sourceConfig:
          generator_rate_type: FIXED
          generator_rate_config: emit_rate 10
          stop_generator_when_sequence_finishes: NONE
          seed: 1
          generator_schema: |
            NORMAL_DISTRIBUTION FLOAT64 0 1

  - connection: 172.17.0.3:9090
    grpc: 172.17.0.3:8080
    capacity: 10000
    links:
      upstreams: [172.17.0.2:9090]
    sinks:
      - name: VOID_SINK
        type: Print
        config:
          inputFormat: CSV
